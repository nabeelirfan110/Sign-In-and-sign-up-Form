<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;700&display=swap">
  <link rel="stylesheet" href="login.css">
</head>
<body>

  <div class="login-box">
    <h1>Login</h1>

    <form action="#" method="post">

      <!-- Username field with icon -->
      <div class="field">
        <input type="text" name="username" placeholder="Username" required>
        <svg viewBox="0 0 24 24">
          <path d="M12 12a5 5 0 100-10 5 5 0 000 10zm0 2c-4 0-8 2-8 5v3h16v-3c0-3-4-5-8-5z"/>
        </svg>
      </div>

      <!-- Password field with icon -->
      <div class="field">
        <input type="password" name="password" placeholder="Password" required>
        <svg viewBox="0 0 24 24">
          <path d="M18 8h-1V6a5 5 0 00-10 0v2H6a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V10a2 2 0 00-2-2zM9 6a3 3 0 016 0v2H9V6z"/>
        </svg>
      </div>

      <div class="options">
        <label><input type="checkbox"> Remember Me</label>
        <a href="#">Forgot Password?</a>
      </div>

      <button type="submit">Submit</button>
    </form>

    <!-- This link takes the user to the signup page -->
    <p class="register-text">
      Don't have an account? <a href="signup.html">Register</a>
    </p>
  </div>

</body>
</html>
